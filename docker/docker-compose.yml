services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medicine_platform
      POSTGRES_USER: medicine
      POSTGRES_PASSWORD: medicine
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  api:
    build:
            context: ..
            dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://medicine:medicine@postgres:5432/medicine_platform?schema=public
      JWT_ACCESS_SECRET: change-me-before-production
      JWT_REFRESH_SECRET: change-me-before-production-too
    ports: ["4000:4000"]
    depends_on: [postgres]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: [./nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on: [api]
volumes:
  postgres_data:
